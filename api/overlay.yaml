  # /income/payment_terms
  - target: $.paths['/income/payment_terms'].get
    update:
      operationId: ListPaymentTerms
  - target: $.paths['/income/payment_terms/{id}'].get
    update:
      operationId: GetPaymentTerm

  # /income/propositions
  - target: $.paths['/income/propositions'].get
    update:
      operationId: ListPropositions
  - target: $.paths['/income/propositions'].post
    update:
      operationId: CreateProposition
  - target: $.paths['/income/propositions/{id}'].get
    update:
      operationId: GetProposition
  - target: $.paths['/income/propositions/{id}'].put
    update:
      operationId: UpdateProposition
  - target: $.paths['/income/propositions/{id}'].delete
    update:
      operationId: DeleteProposition
  - target: $.paths['/income/propositions/{id}/archive'].post
    update:
