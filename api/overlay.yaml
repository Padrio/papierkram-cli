  - target: $.paths['/income/invoices/{id}/archive'].post
    update:
      operationId: ArchiveInvoice
  - target: $.paths['/income/invoices/{id}/unarchive'].post
    update:
      operationId: UnarchiveInvoice
  - target: $.paths['/income/invoices/{id}/cancel'].post
    update:
