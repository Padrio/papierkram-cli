  # /projects
  - target: $.paths['/projects'].get
    update:
      operationId: ListProjects
  - target: $.paths['/projects'].post
    update:
      operationId: CreateProject
  - target: $.paths['/projects/{id}'].get
    update:
      operationId: GetProject
  - target: $.paths['/projects/{id}'].put
    update:
