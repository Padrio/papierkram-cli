  # ---------------------------------------------------------------------------
  # 2. PDF responses
  # Why: the snapshot uses the literal content-type key `["application/pdf"]`
  # and references the *List JSON schema. The endpoints return a PDF file, so
  # the response becomes application/pdf with a binary string.
  # ---------------------------------------------------------------------------
  - target: $.paths['/expense/vouchers/{id}/pdf','/income/estimates/{id}/pdf','/income/invoices/{id}/pdf'].get.responses['200'].content
    remove: true
  - target: $.paths['/expense/vouchers/{id}/pdf','/income/estimates/{id}/pdf','/income/invoices/{id}/pdf'].get.responses['200']
    update:
      content:
        application/pdf:
          schema:
            type: string
            format: binary

  # ---------------------------------------------------------------------------
  # 3. deliver responses
  # Why: the snapshot documents 201 with an invoice/estimate body, but the live
  # API answers 2xx with an empty body. Both 200 and 201 are declared without
  # content so generated code never tries to parse a body.
  # ---------------------------------------------------------------------------
  - target: $.paths['/income/estimates/{id}/deliver','/income/invoices/{id}/deliver'].post.responses['201'].content
    remove: true
  - target: $.paths['/income/estimates/{id}/deliver','/income/invoices/{id}/deliver'].post.responses
    update:
      '200':
        description: Delivery successful (empty body)

  # ---------------------------------------------------------------------------
  # 4. order_direction
  # Why: typed as an array of asc|desc, but the API takes a single value; an
  # array type would make generated code serialize order_direction repeatedly.
  # The old schema is removed first: an update only merges into the existing
  # schema and cannot delete its `items`.
  # ---------------------------------------------------------------------------
  - target: $.paths[*].get.parameters[?@.name == 'order_direction'].schema
    remove: true
  - target: $.paths[*].get.parameters[?@.name == 'order_direction']
    update:
      schema:
        type: string
        enum: [asc, desc]

  # ---------------------------------------------------------------------------
  # 5. Enums: duplicates and null
  # Why: duplicate enum values break code generation (duplicate constants) and
  # are meaningless for validation. Removed by index (snapshot order) before
  # the null removal below, so the indices still match the snapshot.
  # ---------------------------------------------------------------------------
  # difference_reason: index 4 is the second "sonstige".
  - target: $.paths['/expense/vouchers/{id}/pay'].post.requestBody.content['application/json'].schema.properties.difference_reason.enum[4]
    remove: true
  # Expense category (create and update voucher): indices 91-94 repeat 87-90
  # ("Umsatzsteuer frühere Jahre", "Umsatzsteuer Vorjahr",
  # "Umsatzsteuervorauszahlungen", "Umsatzsteuervorauszahlungen 1/11").
  # 99 entries - 4 duplicates - null = 94 unique categories.
  - target: $.paths['/expense/vouchers','/expense/vouchers/{id}']['post','put'].requestBody.content['application/json'].schema.properties.line_items.items.properties.category.enum[91:95]
    remove: true
  # Why: 31 enums list null as a value. Every one of them is already marked
  # `nullable: true`, which is how OpenAPI 3.0 expresses null; null as an enum
  # member produces an invalid constant in generated code and a bogus flag
  # value in completions.
  - target: $..enum[?@ == null]
    remove: true

  # ---------------------------------------------------------------------------
  # 6. Path parameters
  # Why: id/voucher_id/company_id are integers in the API, but the snapshot
  # declares most of them as string and a few as integer. Uniform
  # integer/int64 gives one ID type in generated code and keeps large IDs
  # exact. All {…} placeholders are declared in the snapshot (most at path
  # level, one at operation level), so no declaration has to be added; the
  # spec tests guard that every placeholder stays declared.
  # ---------------------------------------------------------------------------
  - target: $.paths[*].parameters[?@.in == 'path'].schema
    update:
      type: integer
      format: int64
  # The only path parameter declared at operation level instead of path level.
  - target: $.paths['/expense/vouchers/{voucher_id}/documents'].post.parameters[?@.in == 'path'].schema
    update:
      type: integer
      format: int64

  # Query parameters named *_id are integers as well; int64 keeps them
  # consistent with the path IDs above (query IDs are filters such as
  # company_id or project_id).
  - target: $.paths[*].get.parameters[?@.in == 'query' && match(@.name, '.*_id')].schema
    update:
      format: int64

  # ---------------------------------------------------------------------------
  # 7. Date fields in request bodies
  # Why: plain strings without format, although the API expects YYYY-MM-DD
  # (all snapshot examples except the German-style task deadline use it).
  # format: date lets the CLI validate locally before spending credits.
  # supply_date is deliberately left out: it is free text in the API (the
  # snapshot example is "01.05.2020 - 14.05.2020", a service period).
  # ---------------------------------------------------------------------------
  - target: $.paths[*]['post','put'].requestBody.content['application/json'].schema.properties['deadline','document_date','due_date','end_date','entry_date','payment_date','reminder_date','start_date']
    update:
      format: date
  # The task create examples use the German form "15.05.2020" for deadline.
  # The CLI standardizes on ISO dates, so the examples are rewritten to the
  # same day in ISO form; otherwise they would contradict format: date.
  # (Bracket notation because the JSONPath parser treats bare `value` as the
  # RFC 9535 value() function.)
  - target: $.paths['/tracker/tasks'].post.requestBody.content['application/json'].examples[*]['value'].deadline
    update: '2020-05-15'

  # ---------------------------------------------------------------------------
  # 8. String booleans (x-cli-bool-string)
  # Why: the API types these fields as string but they are booleans in meaning
  # ("true"/"false"). The extension tells the CLI to offer a boolean flag and
  # send the string form. Person fields are marked wherever a person body
  # appears, including the people list of company create.
  # relative_costs (task) is a numeric string and stays unmarked.
  # ---------------------------------------------------------------------------
  - target: $.paths['/tracker/tasks','/tracker/tasks/{id}']['post','put'].requestBody.content['application/json'].schema.properties['complete','flagged']
    update:
      x-cli-bool-string: true
  - target: $.paths['/contact/companies/{company_id}/persons','/contact/companies/{company_id}/persons/{id}']['post','put'].requestBody.content['application/json'].schema.properties['default','flagged']
    update:
      x-cli-bool-string: true
  - target: $.paths['/contact/companies'].post.requestBody.content['application/json'].schema.properties.people.items.properties['default','flagged']
    update:
      x-cli-bool-string: true

  # ---------------------------------------------------------------------------
  # 9. Enum hints (x-cli-enum-hints)
  # Why: users (and other tools) say "non_eu" for a supplier outside the EU,
  # but the API value is "foreign". The CLI uses the hint for its error
  # message instead of a bare enum violation.
  # ---------------------------------------------------------------------------
  - target: $.paths['/expense/vouchers','/expense/vouchers/{id}']['post','put'].requestBody.content['application/json'].schema.properties.provenance
    update:
      x-cli-enum-hints:
        non_eu: foreign

  # ---------------------------------------------------------------------------
  # 10. patternProperties
  # Why: patternProperties is JSON Schema / OpenAPI 3.1 only; kin-openapi
  # rejects the 3.0.3 document because of it (169 occurrences). 163 are empty
  # and are dropped. The 6 non-empty ones describe custom_attributes, an
  # object keyed by attribute ID ("^[0-9]+$"). They are rewritten first: the
  # value schema moves to additionalProperties (OpenAPI 3.0) and the key
  # pattern is kept as x-cli-key-pattern for local validation.
  # additionalProperties: false is removed before the update because Overlay
  # 1.0 does not define merging an object into a boolean.
  # ---------------------------------------------------------------------------
  - target: $.paths['/contact/companies','/contact/companies/{id}','/projects','/projects/{id}']['post','put'].requestBody.content['application/json'].schema.properties.custom_attributes.additionalProperties
    remove: true
  - target: $.paths['/contact/companies','/contact/companies/{id}','/projects','/projects/{id}']['post','put'].requestBody.content['application/json'].schema.properties.custom_attributes
    update:
      x-cli-key-pattern: '^[0-9]+$'
      additionalProperties:
        anyOf:
          - type: string
            nullable: true
          - type: integer
            nullable: true
          - type: number
            nullable: true
          - type: boolean
            nullable: true
  - target: $.components.schemas['CompanyWithSimpleEmbeds','ProjectWithDetailedEmbeds'].allOf[1].properties.custom_attributes.additionalProperties
    remove: true
  - target: $.components.schemas['CompanyWithSimpleEmbeds','ProjectWithDetailedEmbeds'].allOf[1].properties.custom_attributes
    update:
      x-cli-key-pattern: '^[0-9]+$'
      additionalProperties:
        type: object
        nullable: false
        properties:
          type:
            type: string
            enum: [custom_attribute]
            nullable: false
          id:
            type: integer
            nullable: false
          name:
            type: string
            nullable: false
          value:
            anyOf:
              - type: string
                nullable: true
              - type: integer
                nullable: true
              - type: number
                nullable: true
              - type: boolean
                nullable: true
  - target: $..patternProperties
    remove: true

  # ---------------------------------------------------------------------------
  # 11. additionalProperties: false in response schemas
  # Why: every response schema is an allOf of a *OnlyReference schema (or a
  # *Flat schema built on it) plus further properties, and the *OnlyReference
  # schemas carry additionalProperties: false. Under allOf that forbids every
  # property of the other branch, so no real response (including all snapshot
  # examples) can validate. Responses are also allowed to grow fields the
  # snapshot does not know yet. Only components are touched: all of them are
  # response schemas. Request bodies are inline under paths and keep their
  # additionalProperties: false, because the API rejects unknown fields (422).
  # ---------------------------------------------------------------------------
  - target: $.components.schemas..[?@.additionalProperties == false].additionalProperties
    remove: true

  # ---------------------------------------------------------------------------
  # 12. Response schemas contradicted by the recorded examples
  # Why: the snapshot's examples are recorded API responses. Where a response
  # schema rejects them, the schema is wrong, and kin-openapi's Validate (which
  # checks examples) fails. The mock server serves these examples as default
  # responses, so they also have to be consistent.
  # ---------------------------------------------------------------------------
  # Error bodies (422) recorded under 201. They carry business rules (the
  # creditor must be a supplier; the customer of an invoice/estimate must not
  # be a supplier), so they are moved into the 422 response's examples under
  # a "could not be created" name instead of being dropped. Each is added to
  # the 422 examples before it is removed from 201.
  - target: $.paths['/expense/vouchers'].post.responses['422'].content['application/json'].examples
    update:
      'API v1 vouchers /expense/vouchers post Voucher could not be created validates the creditor is a supplier':
        value:
          type: error
          error_type: unprocessable_entity
          message: "Lieferant muss ein Lieferant sein"
          correlation_id: 96addca7-dbc4-4aa1-877e-d77f62bdd658
  - target: $.paths['/expense/vouchers'].post.responses['201'].content['application/json'].examples['API v1 vouchers /expense/vouchers post Voucher created validates the creditor is a supplier']
    remove: true
  - target: $.paths['/income/estimates'].post.responses['422'].content['application/json'].examples
    update:
      'API v1 estimates /income/estimates post Estimate could not be created does not allow suppliers as customer companies':
        value:
          type: error
          error_type: unprocessable_entity
          message: "Kunde muss ein Kunde sein"
          correlation_id: e7fd2b47-ba15-4cb9-a4af-fe2cc6e27b6e
  - target: $.paths['/income/estimates'].post.responses['201'].content['application/json'].examples['API v1 estimates /income/estimates post Estimate created does not allow suppliers as customer companies']
    remove: true
  - target: $.paths['/income/invoices'].post.responses['422'].content['application/json'].examples
    update:
      'API v1 invoices /income/invoices post Invoice could not be created does not allow suppliers as customer companies':
        value:
          type: error
          error_type: unprocessable_entity
          message: "Firma / Kontaktname muss ein Kunde sein"
          correlation_id: 532f5f1a-18df-4720-8b94-814e18ed6e27
  - target: $.paths['/income/invoices'].post.responses['201'].content['application/json'].examples['API v1 invoices /income/invoices post Invoice created does not allow suppliers as customer companies']
    remove: true
  # Optional embedded objects are null when unset (examples show null for
  # each of these). OpenAPI 3.0 ignores siblings of $ref, so the reference is
  # wrapped in allOf to carry nullable: true. project is fixed for estimate
  # and invoice alike because both embed it the same way.
  - target: $.components.schemas['EstimateWithDetailedEmbeds','InvoiceWithDetailedEmbeds'].allOf[1].properties.contact_person['$ref']
    remove: true
  - target: $.components.schemas['EstimateWithDetailedEmbeds','InvoiceWithDetailedEmbeds'].allOf[1].properties.contact_person
    update:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/PersonOnlyReference'
  - target: $.components.schemas['EstimateWithDetailedEmbeds','InvoiceWithDetailedEmbeds'].allOf[1].properties.project['$ref']
    remove: true
  - target: $.components.schemas['EstimateWithDetailedEmbeds','InvoiceWithDetailedEmbeds'].allOf[1].properties.project
    update:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/ProjectOnlyReference'
  - target: $.components.schemas.TimeEntryWithDetailedEmbeds.allOf[1].properties.invoice['$ref']
    remove: true
  - target: $.components.schemas.TimeEntryWithDetailedEmbeds.allOf[1].properties.invoice
    update:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/InvoiceFlat'
  - target: $.components.schemas.TaskWithDetailedEmbeds.allOf[1].properties.user['$ref']
    remove: true
  - target: $.components.schemas.TaskWithDetailedEmbeds.allOf[1].properties.user
    update:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/UserFlat'
  - target: $.components.schemas.ProjectWithDetailedEmbeds.allOf[1].properties.default_proposition['$ref']
    remove: true
  - target: $.components.schemas.ProjectWithDetailedEmbeds.allOf[1].properties.default_proposition
    update:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/PropositionFlat'
  - target: $.components.schemas.VoucherWithDetailedEmbeds.allOf[1].properties.creditor['$ref']
    remove: true
  - target: $.components.schemas.VoucherWithDetailedEmbeds.allOf[1].properties.creditor
    update:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/CompanyFlat'
  - target: $.components.schemas.PaymentTermWithDetailedEmbeds.allOf[1].properties.banking_bank_connection['$ref']
    remove: true
  - target: $.components.schemas.PaymentTermWithDetailedEmbeds.allOf[1].properties.banking_bank_connection
    update:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/BankConnectionOnlyReference'
  # Draft and canceled estimates/invoices have no name yet.
  - target: $.components.schemas['EstimateOnlyReference','InvoiceOnlyReference'].properties.name
    update:
      nullable: true
  # Line item numbering is a string such as "1." or "2.1", not an integer.
  - target: $.components.schemas['EstimateWithDetailedEmbeds','InvoiceWithDetailedEmbeds'].allOf[1].properties['line_items','document_charges'].items.properties.position_in_group
    update:
      type: string
  # Every recorded estimate response has document_charge_gross in its line
  # items, the schema does not declare it. --input cleanup (spec 6.3) removes
  # only fields the response schema knows and rejects all others, so without
  # it `estimate describe | estimate update --input -` would fail.
  - target: $.components.schemas.EstimateWithDetailedEmbeds.allOf[1].properties.line_items.items.properties
    update:
      document_charge_gross:
        nullable: true
        readOnly: true
        type: number
  # The API returns supply_date as free text or "2026-08-28 13:41:23 +0200",
  # never as a plain date.
  - target: $.components.schemas.InvoiceFlat.allOf[1].properties.supply_date.format
    remove: true

  # ---------------------------------------------------------------------------
  # 13. Voucher document upload: the file part is required
  # Why: the multipart schema of POST /expense/vouchers/{voucher_id}/documents
  # declares the "file" part without marking it required, so an upload without
  # a file would validate. The endpoint exists only to receive that file, and
  # the mock server must reject an upload that lacks it.
  # ---------------------------------------------------------------------------
  - target: $.paths['/expense/vouchers/{voucher_id}/documents'].post.requestBody.content['multipart/form-data'].schema
    update:
      required:
        - file

  # ---------------------------------------------------------------------------
  # 14. Time entry start and end times (x-cli-pattern-format)
  # Why: started_at_time and ended_at_time are plain strings, although the API
  # takes a wall-clock time HH:MM (all snapshot examples, spec 4.4, R16) and
  # no ISO timestamp. The pattern lets the CLI (and the mock server) reject
  # "9:00" or "2026-10-25T09:00:00+02:00" before credits are spent; the
  # extension names the expected form for help texts and error messages.
  # ---------------------------------------------------------------------------
  # One target per operation (POST collection, PUT object) instead of a cross
  # product, so a future PUT on the collection or POST on {id} is not
  # patched silently.
  - target: $.paths['/tracker/time_entries'].post.requestBody.content['application/json'].schema.properties['started_at_time','ended_at_time']
    update:
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      x-cli-pattern-format: 'HH:MM'
  - target: $.paths['/tracker/time_entries/{id}'].put.requestBody.content['application/json'].schema.properties['started_at_time','ended_at_time']
    update:
      pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
      x-cli-pattern-format: 'HH:MM'

  # ---------------------------------------------------------------------------
  # 15. Unit of billable_duration in time entry bodies
  # Why: the request schema gives no unit. duration and billable_duration in
  # the responses are seconds (examples: 10:00–12:00 = 7200), and the tables
  # show them as h:mm, so without a unit "90" (meant as minutes) would book
  # 1.5 minutes. The description is the flag help. Assumed from the
  # responses; the E2E suite still has to confirm seconds for requests.
  # ---------------------------------------------------------------------------
  - target: $.paths['/tracker/time_entries'].post.requestBody.content['application/json'].schema.properties.billable_duration
    update:
      description: Abrechenbare Dauer in Sekunden
  - target: $.paths['/tracker/time_entries/{id}'].put.requestBody.content['application/json'].schema.properties.billable_duration
    update:
      description: Abrechenbare Dauer in Sekunden
