# OpenAPI Overlay 1.0 for api/openapi.json, the unmodified snapshot of the
# Papierkram API v1. The snapshot is never edited by hand; every correction
# lives here. `go generate ./internal/spec/` runs tools/applyoverlay, which
# applies this file and writes internal/spec/openapi.gen.json (embedded into
# the binary and the single source of truth for flags, types and validation).
#
# JSONPath: targets use RFC 9535 syntax. Overlay 1.0 leaves the dialect open,
# so the x-speakeasy-jsonpath key tells the overlay library to use RFC 9535
# instead of its legacy dialect.
#
# Application is strict: an action whose target matches nothing, or whose
# update changes nothing, fails the generation. When a snapshot refresh fixes
# a defect upstream, the matching action fails and must be removed here.
#
# Actions run top to bottom. Index-based removals refer to the snapshot as
# retrieved (see api/README.md for its SHA-256).
overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: papierkram-cli corrections for the Papierkram API v1
  version: 1.0.0
actions:
  # ---------------------------------------------------------------------------
  # 1. operationIds
  # Why: the snapshot has no operationId at all. oapi-codegen derives function
  # names from them, and the command registry and coverage test reference
  # operations by ID. Scheme <Verb><Resource>[<Action>]: List + plural for
  # collections, Get/Create/Update/Delete/Archive/Unarchive/Cancel/Deliver/Pay
  # + singular for a single object, Get<Resource>Pdf for PDF downloads.
  # ---------------------------------------------------------------------------
  # /banking/bank_connections
  - target: $.paths['/banking/bank_connections'].get
    update:
      operationId: ListBankConnections
  - target: $.paths['/banking/bank_connections/{id}'].get
