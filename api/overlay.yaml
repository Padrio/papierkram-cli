  - target: $.paths['/settings/custom_attributes'].post
    update:
      operationId: CreateCustomAttribute
  - target: $.paths['/settings/custom_attributes/{id}'].get
    update:
      operationId: GetCustomAttribute
  - target: $.paths['/settings/custom_attributes/{id}'].put
    update:
      operationId: UpdateCustomAttribute
  - target: $.paths['/settings/custom_attributes/{id}'].delete
    update:
      operationId: DeleteCustomAttribute
  - target: $.paths['/settings/custom_attributes/{id}/archive'].post
    update:
      operationId: ArchiveCustomAttribute
  - target: $.paths['/settings/custom_attributes/{id}/unarchive'].post
    update:
      operationId: UnarchiveCustomAttribute

  # /tracker/tasks
  - target: $.paths['/tracker/tasks'].get
    update:
      operationId: ListTasks
  - target: $.paths['/tracker/tasks'].post
    update:
      operationId: CreateTask
  - target: $.paths['/tracker/tasks/{id}'].get
    update:
      operationId: GetTask
  - target: $.paths['/tracker/tasks/{id}'].put
    update:
      operationId: UpdateTask
  - target: $.paths['/tracker/tasks/{id}'].delete
    update:
      operationId: DeleteTask
  - target: $.paths['/tracker/tasks/{id}/archive'].post
    update:
      operationId: ArchiveTask
  - target: $.paths['/tracker/tasks/{id}/unarchive'].post
    update:
      operationId: UnarchiveTask

  # /tracker/time_entries
  - target: $.paths['/tracker/time_entries'].get
    update:
      operationId: ListTimeEntries
  - target: $.paths['/tracker/time_entries'].post
    update:
