# GoReleaser v2 configuration (spec 12.2). Pinned to v2.19.0: locally via
# "make snapshot" (go run github.com/goreleaser/goreleaser/v2@v2.19.0), in CI
# via goreleaser-action (job snapshot in .github/workflows/ci.yml).
# Release steps and prerequisites: docs/release.md.
version: 2

project_name: papierkram

before:
  hooks:
    # completions/ and man/ at the repository root (both in .gitignore)
    - sh scripts/completions.sh
    - sh scripts/manpages.sh

builds:
  - id: papierkram
    main: ./cmd/papierkram
    binary: papierkram
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Same variables as the Makefile build target (internal/buildinfo).
    # Commit is the short hash like "make build"; Date is the commit date
    # instead of the build time so that two builds of a commit are identical.
    ldflags:
      - -s -w
      - -X github.com/Padrio/papierkram-cli/internal/buildinfo.Version={{ .Version }}
      - -X github.com/Padrio/papierkram-cli/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/Padrio/papierkram-cli/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: papierkram
    ids: [papierkram]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # owner, group, mode and time fixed: the archives do not depend on the
    # machine, its user or its umask
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    # every archive carries the same extra files (the cask matches the man
    # pages by glob only then)
    files:
      - src: LICENSE
        info: &fileinfo
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info: *fileinfo
      - src: CHANGELOG.md
        info: *fileinfo
      - src: THIRD_PARTY_NOTICES.md
        info: *fileinfo
      - src: completions/*
        info: *fileinfo
      - src: man/*
        info: *fileinfo

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SBOM (SPDX JSON) per archive, written by syft: in CI and the release
# from anchore/sbom-action/download-syft, locally from the PATH
# (docs/release.md). checksums.txt lists the SBOMs as well.
sboms:
  - id: archives
    artifacts: archive
    documents: ["{{ .ArtifactName }}.sbom.json"]
    args: ["$artifact", "--output", "spdx-json=$document"]

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

# The release notes come from CHANGELOG.md (Keep a Changelog): the release
# passes the section of the tag with --release-notes (docs/release.md).
# The changelog stays enabled because GoReleaser ignores --release-notes
# when it is disabled; the git log below is only the fallback for a run
# without notes.
changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^ci"
      - "^chore"

nfpms:
  - id: packages
    ids: [papierkram]
    package_name: papierkram
    formats: [deb, rpm]
    vendor: Pascal Krason
    maintainer: Pascal Krason <p.krason@icloud.com>
    homepage: https://github.com/Padrio/papierkram-cli
    description: |-
      Kommandozeile für die Papierkram-API.
      Rechnungen, Angebote, Belege, Kontakte, Projekte und Zeiten aus dem
      Terminal verwalten, mit JSON-Ausgabe für Skripte und KI-Agents.
    license: MIT
    section: utils
    bindir: /usr/bin
    mtime: "{{ .CommitDate }}"
    contents:
      # short form pk (README "Kurzform pk")
      - src: papierkram
        dst: /usr/bin/pk
        type: symlink
      # gzipped like distribution packages expect (scripts/manpages.sh)
      - src: ./man-gz/*.1.gz
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644
      - src: ./completions/papierkram.bash
        dst: /usr/share/bash-completion/completions/papierkram
        file_info:
          mode: 0644
      # zsh: Fedora/RHEL search site-functions, Debian/Ubuntu only
      # vendor-completions (their zsh is built without /usr/share/zsh/site-functions)
      - src: ./completions/_papierkram
        dst: /usr/share/zsh/site-functions/_papierkram
        packager: rpm
        file_info:
          mode: 0644
      - src: ./completions/_papierkram
        dst: /usr/share/zsh/vendor-completions/_papierkram
        packager: deb
        file_info:
          mode: 0644
      - src: ./completions/papierkram.fish
        dst: /usr/share/fish/vendor_completions.d/papierkram.fish
        file_info:
          mode: 0644
      # bash-completion and fish load a completion file by command name on
      # first use; for pk they load the papierkram script, which also
      # registers pk (scripts/completions.sh). zsh binds pk by #compdef.
      - src: papierkram
        dst: /usr/share/bash-completion/completions/pk
        type: symlink
      - src: papierkram.fish
        dst: /usr/share/fish/vendor_completions.d/pk.fish
        type: symlink
      - src: ./LICENSE
        dst: /usr/share/doc/papierkram/LICENSE
        file_info:
          mode: 0644
      - src: ./THIRD_PARTY_NOTICES.md
        dst: /usr/share/doc/papierkram/THIRD_PARTY_NOTICES.md
        file_info:
          mode: 0644

# Homebrew: a cask in Padrio/homebrew-tap (brew install Padrio/tap/papierkram).
# homebrew_casks instead of brews: brews (formulae) are deprecated in
# GoReleaser v2.19. Uploaded only by a real release, never by a snapshot
# or a prerelease (skip_upload: auto).
homebrew_casks:
  - name: papierkram
    ids: [papierkram]
    repository:
      owner: Padrio
      name: homebrew-tap
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
    commit_author:
      name: Pascal Krason
      email: p.krason@icloud.com
    homepage: https://github.com/Padrio/papierkram-cli
    description: Kommandozeile für die Papierkram-API
    skip_upload: auto
    binaries: [papierkram]
    # GoReleaser has no target for binaries: the short form pk is a second
    # binary stanza with a target (Homebrew cask DSL), see docs/release.md.
    # fish loads completions by command name, so the papierkram script (it
    # registers pk too) is linked a second time as pk.fish; bash
    # (etc/bash_completion.d) and zsh (#compdef) need nothing extra.
    custom_block: |
      binary "papierkram", target: "pk"
      fish_completion "completions/papierkram.fish", target: "pk.fish"
    manpages:
      - man/*.1
    completions:
      bash: completions/papierkram.bash
      zsh: completions/_papierkram
      fish: completions/papierkram.fish
    # the binaries are not notarized: without this Gatekeeper refuses to
    # start them on macOS
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/papierkram"]
          end

# winget: three manifests (version, installer, locale) for Padrio.Papierkram,
# portable from the windows zip archives (GoReleaser v2.19 takes the zip
# archives by itself; it has no "use" option). They land on a branch
# papierkram-<version> of the fork Padrio/winget-pkgs; GoReleaser creates it
# from the fork's default branch. No pull request from here: the fine-grained
# token cannot open one in microsoft/winget-pkgs, so it is opened by hand
# after the release (docs/release.md, Release-Schritte). The release
# workflow checks beforehand that the token can write to the fork
# (scripts/check-fork-push.sh). Uploaded only by a real release, never by a
# snapshot or a prerelease (skip_upload: auto); a snapshot writes the
# manifests to dist/winget/ only.
winget:
  - name: papierkram
    package_identifier: Padrio.Papierkram
    publisher: Pascal Krason
    publisher_url: https://github.com/Padrio/papierkram-cli
    homepage: https://github.com/Padrio/papierkram-cli
    license: MIT
    license_url: https://github.com/Padrio/papierkram-cli/blob/main/LICENSE
    # the descriptions are German, so is the default locale
    default_locale: de-DE
    short_description: Kommandozeile für die Papierkram-API
    ids: [papierkram]
    commit_author:
      name: Pascal Krason
      email: p.krason@icloud.com
    skip_upload: auto
    repository:
      owner: Padrio
      name: winget-pkgs
      branch: "papierkram-{{ .Version }}"
      token: "{{ .Env.PACKAGES_GITHUB_TOKEN }}"
      pull_request:
        enabled: false

# Scoop is suspended (Pascal, 2026-11-09): no Padrio/scoop-bucket. The
# Windows archives stay on the release page; docs/release.md says how to
# bring the scoops section back.

release:
  github:
    owner: Padrio
    name: papierkram-cli
  # vX.Y.Z-rc.1 and the like become a GitHub prerelease, never "latest"
  prerelease: auto
