# Keeps the SHA-pinned actions of .github/workflows current (pin plus tag
# comment are updated together) and the direct Go modules of go.mod.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Version updates cover the direct requirements of go.mod (Dependabot's
  # default for gomod): no pull request for indirect modules, the tool
  # oapi-codegen included (it is listed as indirect; bump it by hand,
  # together with speakeasy-api/openapi). No allow list on purpose: it
  # would change nothing for version updates but also restrict security
  # updates, which then could not fix a vulnerable indirect module.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pinned in go.mod: oapi-codegen v2.8.2 does not compile against
      # newer versions; bump only together with oapi-codegen
      - dependency-name: github.com/speakeasy-api/openapi
