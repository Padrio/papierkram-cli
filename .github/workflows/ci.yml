name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # go.mod declares 1.26.0 as the minimum; CI builds with the same
          # toolchain line as local development.
          go-version: '1.27.x'
      - run: go build ./...
      # -race needs cgo; the windows runners ship gcc (mingw), macOS/Linux have a C compiler.
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: go generate without diff
        run: |
          go generate ./...
          git diff --exit-code
      # Threshold is 0 for now; Task 43 raises it to 80.
      - name: coverage
        run: scripts/coverage.sh 0
