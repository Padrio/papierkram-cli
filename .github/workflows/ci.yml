name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # go.mod declares 1.26.0 as the minimum; CI builds with the same
          # toolchain line as local development.
          go-version: '1.27.x'
      - run: go build ./...
      # -race needs cgo; the windows runners ship gcc (mingw), macOS/Linux have a C compiler.
      - run: go test -race ./...
        env:
          CGO_ENABLED: '1'
      # The live suite (spec 11.1) must compile and skip without its
      # variables; they are set empty here so no sandbox is ever reached
      # from the normal CI (the live run is .github/workflows/e2e.yml).
      - name: e2e suite compiles and skips
        shell: bash
        env:
          PAPIERKRAM_E2E_SUBDOMAIN: ''
          PAPIERKRAM_E2E_TOKEN: ''
          PAPIERKRAM_E2E_SANDBOX_CONFIRM: ''
        run: |
          # names only, never values
          set_vars="$(env | grep -E '^PAPIERKRAM_E2E_[A-Z_]*=.' | cut -d= -f1 || true)"
          if [ -n "$set_vars" ]; then
            echo "gesetzt: $set_vars; die normale CI läuft nie gegen eine Sandbox" >&2
            exit 1
          fi
          go vet -tags e2e ./e2e/...
          go test -count=1 -tags e2e ./e2e/...
      # no test may leave files in the repository, on any OS
      - name: tests leave the tree clean
        shell: bash
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  keychain:
    name: keychain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      # Linux has no Secret Service on the runner: start a private D-Bus session
      # and gnome-keyring for the duration of the test. Unlocking with a NON-empty
      # password makes the daemon create the default "login" collection (an empty
      # password leaves no unlocked default collection); same recipe as
      # zalando/go-keyring's CI. The password is a throwaway CI value, not a secret.
      - name: keychain integration test (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          mkdir -p "$HOME/.local/share/keyrings"
          chmod 700 -R "$HOME/.local"
          dbus-run-session -- sh -c "echo 'pk-ci-keyring-pass' | gnome-keyring-daemon --unlock --components=secrets && go test -count=1 -v -tags keychain ./internal/auth/..."
      # macOS uses the runner's login keychain, Windows the Credential Manager.
      - name: keychain integration test
        if: runner.os != 'Linux'
        run: go test -tags keychain -count=1 -v ./internal/auth/...

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # the tag only adds the e2e suite; everything else is linted as before
          args: --build-tags=e2e
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # git diff misses newly generated untracked files; git status sees both.
      - name: go generate without diff
        run: |
          go generate ./...
          git diff --exit-code
          git status --porcelain
          test -z "$(git status --porcelain)"
      # total over all packages except internal/api/gen, tools/ and e2e
      - name: coverage
        run: scripts/coverage.sh 80
      # no test may leave files in the repository (untracked included)
      - name: tests leave the tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # GoReleaser dry run (spec 12.1/12.2): builds every target, the archives
  # and the deb/rpm packages without publishing anything. No token is set:
  # tap and bucket are written to dist/ only (docs/release.md).
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # GoReleaser reads tags and the commit date from the history
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean
      - name: dist holds 6 archives, deb and rpm
        run: |
          ls -l dist
          set -- dist/papierkram_*_darwin_amd64.tar.gz dist/papierkram_*_darwin_arm64.tar.gz \
            dist/papierkram_*_linux_amd64.tar.gz dist/papierkram_*_linux_arm64.tar.gz \
            dist/papierkram_*_windows_amd64.zip dist/papierkram_*_windows_arm64.zip \
            dist/papierkram_*_linux_amd64.deb dist/papierkram_*_linux_arm64.deb \
            dist/papierkram_*_linux_amd64.rpm dist/papierkram_*_linux_arm64.rpm \
            dist/checksums.txt
          for f in "$@"; do
            test -f "$f" || { echo "fehlt: $f" >&2; exit 1; }
          done
          test "$(grep -c . dist/checksums.txt)" -eq 10
          # pk link, man pages and completions in the package
          dpkg-deb -c dist/papierkram_*_linux_amd64.deb | grep -F './usr/bin/pk -> papierkram'
          dpkg-deb -c dist/papierkram_*_linux_amd64.deb | grep -F './usr/share/man/man1/papierkram.1'
          dpkg-deb -c dist/papierkram_*_linux_amd64.deb | grep -F './usr/share/bash-completion/completions/papierkram'
          dpkg-deb -c dist/papierkram_*_linux_amd64.deb | grep -F './usr/share/bash-completion/completions/pk -> papierkram'
          tar -tzf dist/papierkram_*_linux_amd64.tar.gz | grep -Fx 'completions/_papierkram'
          tar -tzf dist/papierkram_*_linux_amd64.tar.gz | grep -Fx 'man/papierkram.1'
      # papierkram and pk complete in every shell (pwsh ships with the runner)
      - name: completions for papierkram and pk
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh fish
          REQUIRE_ALL_SHELLS=1 sh scripts/check-completions.sh
      # the notes script of release.yml: a section is found, a missing one fails
      - name: release notes script
        run: |
          printf '%s\n' '## [Unreleased]' '' '## [1.2.3] - 2027-01-01' '' '- Eintrag' '' '[1.2.3]: https://example.invalid' > "$RUNNER_TEMP/cl.md"
          test "$(sh scripts/release-notes.sh v1.2.3 "$RUNNER_TEMP/cl.md")" = '- Eintrag'
          if sh scripts/release-notes.sh v9.9.9 "$RUNNER_TEMP/cl.md"; then exit 1; fi
      # dist/, completions/ and man/ are in .gitignore
      - name: snapshot leaves the tree clean
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
