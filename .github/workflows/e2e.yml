name: E2E (Sandbox)

# Live suite against a Papierkram SANDBOX account (spec 11.1), started by
# hand only and only on main. Subdomain and token come from the secrets
# PAPIERKRAM_E2E_SUBDOMAIN and PAPIERKRAM_E2E_TOKEN of the environment
# "sandbox"; the input repeats the subdomain as confirmation
# (PAPIERKRAM_E2E_SANDBOX_CONFIRM). See e2e/README.md.
on:
  workflow_dispatch:
    inputs:
      sandbox_confirm:
        description: 'Subdomain des Sandbox-Accounts zur Bestätigung (genau wie das Secret PAPIERKRAM_E2E_SUBDOMAIN)'
        required: true
        type: string

permissions:
  contents: read

# one live run at a time: runs share the sandbox and its credits
concurrency:
  group: e2e-sandbox
  cancel-in-progress: false

jobs:
  e2e:
    # Only the reviewed state of main runs with the secrets. The secrets
    # belong to the GitHub environment "sandbox", whose protection rules
    # (required reviewers, branch main) the repository owner sets up.
    if: github.ref == 'refs/heads/main'
    environment: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      # A mistyped confirmation would only skip every test; fail visibly instead.
      - name: confirmation matches the sandbox
        env:
          PAPIERKRAM_E2E_SUBDOMAIN: ${{ secrets.PAPIERKRAM_E2E_SUBDOMAIN }}
          PAPIERKRAM_E2E_SANDBOX_CONFIRM: ${{ inputs.sandbox_confirm }}
        run: |
          # a secret saved with a line break (or blanks) never equals the
          # input, and the suite compares exactly as well: name the cause
          case "$PAPIERKRAM_E2E_SUBDOMAIN" in
            *[[:space:]]*)
              echo "Secret PAPIERKRAM_E2E_SUBDOMAIN enthält einen Zeilenumbruch oder Leerraum: ohne ihn neu speichern." >&2
              exit 1
              ;;
          esac
          if [ -z "$PAPIERKRAM_E2E_SUBDOMAIN" ] || [ "$PAPIERKRAM_E2E_SANDBOX_CONFIRM" != "$PAPIERKRAM_E2E_SUBDOMAIN" ]; then
            echo "Bestätigung stimmt nicht mit dem Secret PAPIERKRAM_E2E_SUBDOMAIN überein (oder Secret fehlt)." >&2
            exit 1
          fi
      - name: live suite
        id: suite
        shell: bash
        env:
          PAPIERKRAM_E2E_SUBDOMAIN: ${{ secrets.PAPIERKRAM_E2E_SUBDOMAIN }}
          PAPIERKRAM_E2E_TOKEN: ${{ secrets.PAPIERKRAM_E2E_TOKEN }}
          PAPIERKRAM_E2E_SANDBOX_CONFIRM: ${{ inputs.sandbox_confirm }}
        run: |
          set -o pipefail
          go test -count=1 -timeout 25m -tags e2e -v ./e2e/... 2>&1 | tee e2e.log
      # The suite redacts the token; this check is the second line of
      # defence before the log leaves the runner (the repository is
      # public, so are its artifacts). The token is looked for before and
      # after the sandbox subdomain is replaced by <sandbox> (fixed string,
      # any case; perl reads it from the environment): a token that
      # contains the subdomain would be cut by the replacement. Then
      # neither token nor subdomain may be left. Both go to grep as a
      # pattern file (process substitution), never as an argument. An
      # empty secret cannot be checked, a grep or sed error proves nothing:
      # log deleted, step failed.
      - name: token check
        id: tokencheck
        if: always()
        shell: bash
        env:
          PAPIERKRAM_E2E_TOKEN: ${{ secrets.PAPIERKRAM_E2E_TOKEN }}
          PAPIERKRAM_E2E_SUBDOMAIN: ${{ secrets.PAPIERKRAM_E2E_SUBDOMAIN }}
        run: |
          stripped=""
          # delete the log, name the reason, fail the step (no summary, no upload)
          reject() {
            rm -f e2e.log ${stripped:+"$stripped"}
            echo "$1: Log gelöscht, kein Upload" >&2
            exit 1
          }
          # look NAME PATTERN FILE [-i]: rejects on a hit (grep exit 0) and
          # on a grep error (exit 2); only exit 1 means nothing was found
          look() {
            local rc=0
            grep -qF "${@:4}" -f <(printf '%s\n' "$2") -- "$3" || rc=$?
            case "$rc" in
              0) reject "$1 im Log gefunden" ;;
              1) ;;
              *) reject "Log nicht auf $1 geprüft (grep-Fehler)" ;;
            esac
          }
          if [ ! -f e2e.log ]; then
            echo "clean=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # blanks, tabs and line breaks around the secret are no part of
          # the token: the check looks for the bare value (an empty last
          # pattern line would also match every log line)
          token="$PAPIERKRAM_E2E_TOKEN"
          while [[ $token == [[:space:]]* ]]; do token="${token#?}"; done
          while [[ $token == *[[:space:]] ]]; do token="${token%?}"; done
          [ -n "$token" ] || reject "Token-Secret leer"
          if [[ $token == *[$'\r\n']* ]]; then
            reject "Token-Secret enthält einen Zeilenumbruch"
          fi
          # the suite logs the subdomain trimmed and in lower case
          SANDBOX_SUB="${PAPIERKRAM_E2E_SUBDOMAIN//[[:space:]]/}"
          [ -n "$SANDBOX_SUB" ] || reject "Subdomain-Secret leer"
          export SANDBOX_SUB
          look Token "$token" e2e.log
          if ! perl -i -pe 'BEGIN { $s = $ENV{SANDBOX_SUB}; die "leer\n" if $s eq "" } s/\Q$s\E/<sandbox>/gi' e2e.log; then
            reject "Subdomain nicht geschwärzt"
          fi
          look Token "$token" e2e.log
          # without the placeholders, so a subdomain such as "box" still
          # passes; through a file, so a failing sed cannot look clean
          stripped="$(mktemp "$RUNNER_TEMP/e2e-check.XXXXXX")" || reject "Prüfdatei nicht angelegt"
          sed 's/<sandbox>//g' e2e.log > "$stripped" || reject "Log ohne Platzhalter nicht gelesen (sed-Fehler)"
          look Subdomain "$SANDBOX_SUB" "$stripped" -i
          rm -f "$stripped"
          echo "clean=true" >> "$GITHUB_OUTPUT"
      - name: summary
        if: always() && steps.tokencheck.outputs.clean == 'true'
        shell: bash
        run: |
          # grep exit 1 is "no line"; an error is no empty result
          rc=0
          lines="$(grep -E 'ABDECKUNG|ABWEICHUNG|Credits:' e2e.log)" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "Log nicht gelesen (grep-Fehler): keine Zusammenfassung" >&2
            exit 1
          fi
          # the fence is longer than every run of backticks in the lines,
          # so no log line can close the block
          fence='````'
          while [[ $lines == *"$fence"* ]]; do fence="$fence\`"; done
          {
            echo '## E2E-Ergebnis'
            echo
            echo "${fence}text"
            if [ -n "$lines" ]; then printf '%s\n' "$lines"; fi
            echo "$fence"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: log artifact
        if: always() && steps.tokencheck.outputs.clean == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-log
          path: e2e.log
          retention-days: 14
          if-no-files-found: error
