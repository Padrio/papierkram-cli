name: Release

# Runs only when Pascal pushes a version tag (docs/release.md); never on
# branches, pull requests or forks. Publishes the GitHub release and the
# Homebrew cask (Padrio/homebrew-tap) with GoReleaser (.goreleaser.yaml).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # a fork that copies the tag never publishes
    if: github.repository == 'Padrio/papierkram-cli' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser reads tags and the commit date from the history
          fetch-depth: 0
          # GoReleaser publishes through the API (GITHUB_TOKEN and
          # PACKAGES_GITHUB_TOKEN from env), never by git push: no token in
          # .git/config for the hooks and later steps
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
      # the notes live outside the work tree: GoReleaser refuses a dirty tree
      - name: release notes from CHANGELOG.md
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - name: token for tap and bucket is set
        env:
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
        run: |
          if [ -z "$PACKAGES_GITHUB_TOKEN" ]; then
            echo "Secret PACKAGES_GITHUB_TOKEN fehlt (docs/release.md, Voraussetzungen)" >&2
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_GITHUB_TOKEN: ${{ secrets.PACKAGES_GITHUB_TOKEN }}
